name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live homepage
        run: |
          for attempt in {1..18}; do
            html="$(curl -fsSL --max-time 20 https://kong-158.github.io/ || true)"
            if printf '%s' "$html" | grep -q 'PERSONAL NOTES / 个人记录'; then
              echo 'Live homepage contains the new research-report site marker.'
              exit 0
            fi
            sleep 10
          done
          echo 'The new homepage marker was not found on the live site.' >&2
          exit 1

  report:
    if: always() && github.event_name == 'push'
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh issue comment 4 --repo "${{ github.repository }}" --body "Deployment run ${RUN_ID}: build=${BUILD_RESULT}, deploy=${DEPLOY_RESULT}, live-site=${VERIFY_RESULT}, commit=${COMMIT_SHA}"
